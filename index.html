<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora MM103</title>
<meta name="description" content="Bitácora de Mantenimiento MM103 — funciona sin internet">
<meta name="theme-color" content="#0f5e63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f5f6;--text:#14212b;--muted:#5d6b76;--brand:#0f5e63;--bad:#b3261e}
@media (prefers-color-scheme: dark){:root{--bg:#0f1418;--text:#e6edf2;--muted:#9aa9b4;--brand:#4fb3b8;--bad:#ff8a80}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.carga{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;text-align:center}
.carga img{width:96px;height:96px;border-radius:22px;margin-bottom:14px}
.carga h1{font-size:20px;margin:0 0 6px}
.carga p{color:var(--muted);margin:4px 0;max-width:420px}
.carga .error{color:var(--bad)}
.carga button{margin-top:16px;min-height:46px;border:0;border-radius:12px;padding:10px 20px;background:var(--brand);color:#fff;font:600 16px system-ui;cursor:pointer}
.spin{width:28px;height:28px;border:3px solid rgba(127,127,127,.3);border-top-color:var(--brand);border-radius:50%;animation:g 0.9s linear infinite;margin:10px auto}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="carga">
  <img src="icon-192.png" alt="">
  <h1>Bitácora de Mantenimiento MM103</h1>
  <div class="spin" id="spin"></div>
  <p id="msg">Abriendo la app…</p>
</div>
<script>
'use strict';
var SHELL_VERSION = '0.2.0';
var API_URL = 'https://script.google.com/macros/s/AKfycbxzVSB0hEQgd9TW01NhmVffLJyioYIg0cRhdRcLxAbYOcT8hCvG-8yA2vi6bA8g936cRw/exec';

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

function abrirDB() {
  return new Promise(function (res) {
    var rq;
    try { rq = indexedDB.open('bitacora_mm103', 2); } catch (e) { return res(null); }
    rq.onupgradeneeded = function () {
      var d = rq.result;
      ['meta', 'cache', 'outbox', 'errores'].forEach(function (s) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); });
    };
    rq.onsuccess = function () { res(rq.result); };
    rq.onerror = function () { res(null); };
  });
}
function leerMeta(db, k) {
  return new Promise(function (res) {
    if (!db) return res(null);
    var rq = db.transaction('meta').objectStore('meta').get(k);
    rq.onsuccess = function () { res(rq.result || null); }; rq.onerror = function () { res(null); };
  });
}
function guardarMeta(db, k, v) {
  return new Promise(function (res) {
    if (!db) return res();
    var tx = db.transaction('meta', 'readwrite'); tx.objectStore('meta').put(v, k);
    tx.oncomplete = function () { res(); }; tx.onerror = function () { res(); };
  });
}
function mensaje(txt, error, boton) {
  document.getElementById('spin').style.display = error ? 'none' : '';
  var m = document.getElementById('msg'); m.textContent = txt; m.className = error ? 'error' : '';
  var b = document.querySelector('.carga button'); if (b) b.remove();
  if (boton) { b = document.createElement('button'); b.textContent = boton; b.onclick = function () { location.reload(); }; document.querySelector('.carga').appendChild(b); }
}
function descargarFuente() {
  return fetch(API_URL, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ accion: 'fuente' }), credentials: 'omit', redirect: 'follow'
  }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r.ok || !r.html) throw new Error(r.mensaje || 'Respuesta incompleta');
    return { hash: r.hash, html: r.html, t: Date.now() };
  });
}
// Mete la interfaz original de Apps Script en esta página, con el puente offline antes que nada.
function mostrarApp(html) {
  var cabeza =
    '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
    '<meta name="theme-color" content="#0f5e63"><link rel="manifest" href="manifest.webmanifest">' +
    '<link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png">' +
    '<title>Bitácora MM103</title><script src="puente.js"><\/script>';
  html = html.replace(/<base[^>]*>/i, '');
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + cabeza; }) : cabeza + html;
  document.open();
  document.write(html);
  document.close();
}

abrirDB().then(function (db) {
  return leerMeta(db, 'fuente').then(function (f) {
    if (f && f.html) return mostrarApp(f.html);
    if (!navigator.onLine) return mensaje('La primera vez necesitas internet para descargar la app. Después funciona sin señal.', true, 'Reintentar');
    mensaje('Descargando la app por primera vez…');
    return descargarFuente().then(function (nf) {
      return guardarMeta(db, 'fuente', nf).then(function () { mostrarApp(nf.html); });
    }).catch(function () {
      mensaje('No se pudo descargar la app. Revisa tu conexión e inténtalo de nuevo.', true, 'Reintentar');
    });
  });
});
</script>
</body>
</html>
